name: Build Android PRoot host

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-proot-android.yml"
      - "tools/build_proot_android.sh"
      - "tools/fetch_runtime_sources.py"
      - "tools/runtime-sources.lock.json"

permissions:
  contents: read

concurrency:
  group: ramenwine-proot-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-proot-host:
    name: Compile PRoot for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "\$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="\$SDK_ROOT" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=\$SDK_ROOT/ndk/30.0.16248370" >> "\$GITHUB_ENV"

      - name: Fetch checksum-pinned source inputs
        run: |
          python3 tools/fetch_runtime_sources.py \
            --lock tools/runtime-sources.lock.json \
            --output build/runtime-sources

      - name: Build Android ARM64 PRoot
        run: |
          chmod +x tools/build_proot_android.sh
          tools/build_proot_android.sh \
            --sources build/runtime-sources \
            --output build/proot-host

      - name: Upload PRoot host-stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramenwine-proot-android-arm64
          path: build/proot-host/proot-android-arm64-stage.zip
          if-no-files-found: error
          retention-days: 14

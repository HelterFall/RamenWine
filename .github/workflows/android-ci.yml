name: Android CI · Prebuilt runtime APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ramenwine-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test runtime packager and ELF auditor
        run: python -m unittest discover -s tools/tests -v

      - name: Enable ARM64 containers for Debian rootfs
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare guest rootfs output directory
        run: |
          rm -rf build/prebuilt-runtime/glibc-proot-box64/rootfs
          mkdir -p build/prebuilt-runtime/glibc-proot-box64

      - name: Build cached Debian ARM64 guest rootfs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/runtime-rootfs.Dockerfile
          platforms: linux/arm64
          outputs: type=local,dest=build/prebuilt-runtime/glibc-proot-box64/rootfs
          cache-from: type=gha,scope=ramenwine-debian-arm64-rootfs
          cache-to: type=gha,scope=ramenwine-debian-arm64-rootfs,mode=max,ignore-error=true

      - name: Assemble runtime from prebuilt PRoot, Box64 and Wine
        shell: bash
        run: |
          chmod +x tools/prepare_prebuilt_runtime.sh
          tools/prepare_prebuilt_runtime.sh

      - name: Install Nix for the pinned Wawona Android build
        uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = auto
            cores = 4

      - name: Build and import pinned Wawona Android bundle
        run: tools/build_wawona_android.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android toolchain
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Run runtime path regression tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK with prebuilt runtime
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Confirm APK contains the prebuilt runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RUNTIME_ZIP="$RUNNER_TEMP/ramenwine-runtime.zip"

          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "assets/runtime/ramenwine-runtime.zip"

          # Info-ZIP validates a named archive file; it does not accept an
          # archive streamed to stdin via "unzip -t -".
          unzip -p "$APK" "assets/runtime/ramenwine-runtime.zip" > "$RUNTIME_ZIP"
          test -s "$RUNTIME_ZIP"
          unzip -t "$RUNTIME_ZIP"
          unzip -Z1 "$RUNTIME_ZIP" | grep -Fx "runtime-manifest.json"

      - name: Confirm APK contains the pinned Wawona display bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          MANIFEST="app/src/main/assets/wawona/provenance.json"

          test -s "$MANIFEST"
          unzip -Z1 "$APK" | grep -Fx "assets/wawona/provenance.json"

          python3 - "$APK" "$MANIFEST" <<'PY'
          import json
          import sys
          import zipfile

          apk_path, manifest_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as stream:
              manifest = json.load(stream)

          libraries = manifest.get("nativeLibraries")
          if not isinstance(libraries, dict) or not libraries:
              raise SystemExit("Wawona provenance manifest has no native libraries")

          with zipfile.ZipFile(apk_path) as archive:
              names = set(archive.namelist())
              required = {
                  "lib/arm64-v8a/" + name
                  for name in libraries
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(
                      "APK is missing Wawona native libraries: " + ", ".join(missing)
                  )

          print(f"Verified Wawona provenance and {len(libraries)} native libraries in APK")
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ramenwine-debug-apk-prebuilt-runtime
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Focused checks

on:
  push:
    branches: [main, feature/wawona-shm-smoke]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ramenwine-focused-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test runtime packager
        run: python -m unittest discover -s tools/tests -v

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile-only Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run focused JVM unit tests
        run: |
          if ! gradle --no-daemon testDebugUnitTest; then
            echo "::group::JUnit failure details"
            for report in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
              if grep -q 'failures="[1-9]' "$report"; then
                cat "$report"
              fi
            done
            echo "::endgroup::"
            exit 1
          fi

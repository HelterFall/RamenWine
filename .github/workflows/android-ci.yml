name: Android CI · Prebuilt runtime and Wawona APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ramenwine-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK from prebuilt runtime bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test runtime packager, ELF auditor and Wawona release importer
        run: python -m unittest discover -s tools/tests -v

      - name: Enable ARM64 containers for Debian rootfs
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare guest rootfs output directory
        run: |
          rm -rf build/prebuilt-runtime/glibc-proot-box64/rootfs
          mkdir -p build/prebuilt-runtime/glibc-proot-box64

      - name: Build cached Debian ARM64 guest rootfs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/runtime-rootfs.Dockerfile
          platforms: linux/arm64
          outputs: type=local,dest=build/prebuilt-runtime/glibc-proot-box64/rootfs
          cache-from: type=gha,scope=ramenwine-debian-arm64-rootfs
          cache-to: type=gha,scope=ramenwine-debian-arm64-rootfs,mode=max,ignore-error=true

      - name: Assemble offline Wine, Box64 and PRoot runtime
        shell: bash
        run: |
          chmod +x tools/prepare_prebuilt_runtime.sh
          tools/prepare_prebuilt_runtime.sh

      - name: Validate offline runtime package
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ZIP="app/src/main/assets/runtime/ramenwine-runtime.zip"
          test -s "$RUNTIME_ZIP"
          unzip -t "$RUNTIME_ZIP"
          unzip -Z1 "$RUNTIME_ZIP" | grep -Fx "runtime-manifest.json"

      - name: Download and stage official prebuilt Wawona release
        shell: bash
        run: |
          chmod +x tools/fetch_wawona_android.sh
          tools/fetch_wawona_android.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android toolchain
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Run Android runtime and Wawona adapter tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify embedded runtime and Wawona payload hashes
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RUNTIME_ZIP="$RUNNER_TEMP/ramenwine-runtime.zip"
          MANIFEST="app/src/main/assets/wawona/provenance.json"

          test -s "$APK"
          test -s "$MANIFEST"

          unzip -Z1 "$APK" | grep -Fx "assets/runtime/ramenwine-runtime.zip"
          unzip -p "$APK" "assets/runtime/ramenwine-runtime.zip" > "$RUNTIME_ZIP"
          test -s "$RUNTIME_ZIP"
          unzip -t "$RUNTIME_ZIP"
          unzip -Z1 "$RUNTIME_ZIP" | grep -Fx "runtime-manifest.json"

          unzip -Z1 "$APK" | grep -Fx "assets/wawona/provenance.json"
          python3 - "$APK" "$MANIFEST" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile

          apk_path, manifest_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as stream:
              manifest = json.load(stream)

          expected_identity = {
              "sourceReleaseTag": "v26.8.12",
              "sourceRevision": "75ffe2982bd7d99b29b7e743c4f70a9becf61f86",
              "sourceVersion": "26.8.12",
              "sourceAsset": "Wawona-26.8.12.apk",
              "upstreamAssetSha256": "f9a3f82ac9c6e47701622f9f3d9be355cb549438e34c49760c7ac9b528dc5570",
              "apkSha256": "f9a3f82ac9c6e47701622f9f3d9be355cb549438e34c49760c7ac9b528dc5570",
          }
          for key, value in expected_identity.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Unexpected Wawona provenance field: {key}")

          libraries = manifest.get("nativeLibraries")
          if not isinstance(libraries, dict) or not libraries:
              raise SystemExit("Wawona provenance manifest has no native libraries")

          required = {"libEGL_angle.so", "libGLESv2_angle.so", "libwawona.so"}
          if not required.issubset(libraries):
              raise SystemExit("Wawona manifest does not contain the required ANGLE/Wawona libraries")

          with zipfile.ZipFile(apk_path) as archive:
              names = set(archive.namelist())
              for name, expected_hash in libraries.items():
                  entry_name = "lib/arm64-v8a/" + name
                  if entry_name not in names:
                      raise SystemExit(f"APK is missing {entry_name}")
                  digest = hashlib.sha256()
                  with archive.open(entry_name) as payload:
                      for block in iter(lambda: payload.read(1024 * 1024), b""):
                          digest.update(block)
                  if digest.hexdigest() != expected_hash:
                      raise SystemExit(f"APK native-library digest mismatch: {name}")

              for root in ("xkb", "fonts", "weston"):
                  prefix = f"assets/wawona/{root}/"
                  if not any(name.startswith(prefix) for name in names):
                      raise SystemExit(f"APK is missing Wawona support assets: {root}")

          print(
              f"Verified Wawona {manifest['sourceVersion']}: "
              f"{len(libraries)} ARM64 libraries and {len(manifest['assets'])} support assets"
          )
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ramenwine-debug-apk-prebuilt-runtime
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

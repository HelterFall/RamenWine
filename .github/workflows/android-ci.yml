name: Android CI · Prebuilt runtime APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ramenwine-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test runtime packager and ELF auditor
        run: python -m unittest discover -s tools/tests -v

      - name: Enable ARM64 containers for Debian rootfs
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare guest rootfs output directory
        run: |
          rm -rf build/prebuilt-runtime/glibc-proot-box64/rootfs
          mkdir -p build/prebuilt-runtime/glibc-proot-box64

      - name: Build cached Debian ARM64 guest rootfs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/runtime-rootfs.Dockerfile
          platforms: linux/arm64
          outputs: type=local,dest=build/prebuilt-runtime/glibc-proot-box64/rootfs
          cache-from: type=gha,scope=ramenwine-debian-arm64-rootfs
          cache-to: type=gha,scope=ramenwine-debian-arm64-rootfs,mode=max,ignore-error=true

      - name: Assemble runtime from prebuilt PRoot, Box64 and Wine
        shell: bash
        run: |
          chmod +x tools/prepare_prebuilt_runtime.sh
          tools/prepare_prebuilt_runtime.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android toolchain
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Build debug APK with prebuilt runtime
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Confirm APK contains the prebuilt runtime payload
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "assets/runtime/ramenwine-runtime.zip"
          unzip -p "$APK" "assets/runtime/ramenwine-runtime.zip" | unzip -t -

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ramenwine-debug-apk-prebuilt-runtime
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

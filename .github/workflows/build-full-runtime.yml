name: Build complete Windows runtime (PRoot + Box64 + Wine 11)

# Heavy runtime builds are isolated from the normal Android CI workflow.
on:
  push:
    branches:
      - feature/wawona-shm-smoke
    paths:
      - ".github/workflows/build-full-runtime.yml"
      - "tools/build_full_runtime.py"
      - "tools/build_proot_host.py"
      - "tools/assemble_proot_host.py"
      - "tools/build_glibc_runtime.py"
      - "tools/package_runtime.py"
      - "tools/wayland_probe.c"
  workflow_dispatch:

concurrency:
  group: ramenwine-full-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build and validate ARM64 Wine runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout RamenWine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Ubuntu, Docker and FUSE
        run: |
          set -euxo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          command -v docker
          command -v dpkg-deb
          docker info
          ls -l /dev/fuse
          test -c /dev/fuse
          df -h
          python3 --version

      - name: Run runtime builder unit tests
        run: |
          set -euxo pipefail
          python3 -m unittest \
            tools.tests.test_build_full_runtime \
            tools.tests.test_build_proot_host \
            tools.tests.test_assemble_proot_host \
            tools.tests.test_build_glibc_runtime \
            tools.tests.test_package_runtime -v
